<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>

    {% include nav.html %}

    {{ content }}

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>

</body>
</html>
