---
layout: default
---

<article class="post-page">
    <header class="post-header">
        <span class="post-category">{{ page.category }}</span>
        <h1 class="post-title">{{ page.title }}</h1>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </header>

    <div class="post-body featured-text">
        {{ content }}
    </div>

    <footer class="post-footer">
        <a href="{{ '/' | relative_url }}#writing" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Writing
        </a>
    </footer>
</article>
